name: Sync from GitHub

# GitHub (PACE-1/chaptarr) is the source of truth; Forgejo only runs CI and hosts images.
# Every branch and tag that exists on GitHub is copied here as-is. Branches that exist
# only on Forgejo are never touched. Pushing with SYNC_TOKEN (not the job token) is what
# lets the synced commits trigger ci.yml.
# Schedules run from the default branch, so this file must be on it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-from-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ci-linux
    steps:
    - name: Mirror GitHub branches and tags
      shell: bash
      env:
        SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        SOURCE: https://github.com/PACE-1/chaptarr.git
      run: |
        set -euo pipefail
        if [[ -z "$SYNC_TOKEN" ]]; then
          echo "SYNC_TOKEN secret is not set."
          exit 1
        fi

        target="${GITHUB_SERVER_URL/https:\/\//https://sync:${SYNC_TOKEN}@}/${GITHUB_REPOSITORY}.git"

        git init -q --bare mirror.git
        cd mirror.git
        git fetch -q --prune "$SOURCE" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

        changed=0
        while read -r sha ref; do
          remote="$(git ls-remote "$target" "$ref" | cut -f1)"
          if [[ "$remote" != "$sha" ]]; then
            echo "Updating $ref: ${remote:-<new>} -> $sha"
            git push -q --force "$target" "$ref:$ref"
            changed=$((changed + 1))
          fi
        done < <(git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags)

        echo "$changed ref(s) updated."
