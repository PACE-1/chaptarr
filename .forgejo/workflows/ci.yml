name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Forgejo reads .forgejo/workflows instead of .github/workflows, so this file is
# the whole CI for the fork's Forgejo mirror. The GitHub workflows stay untouched.
# Everything runs on the self-hosted ci-linux runners.

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    runs-on: ci-linux
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

  backend:
    runs-on: ci-linux
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: linux-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/**/*.csproj') }}
        restore-keys: |
          linux-nuget-

    - name: Restore
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj

    - name: Build
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    runs-on: ci-linux
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install
      run: |
        npm install -g yarn@1.22.22
        yarn install --frozen-lockfile

    # Upstream ships ~1,300 existing lint errors (mostly whitespace/indent). Reported but
    # non-blocking until a dedicated cleanup lands; typecheck and build stay required.
    - name: Lint (non-blocking)
      continue-on-error: true
      run: yarn lint

    - name: Typecheck
      run: yarn typecheck

    - name: Build
      run: yarn build

  postgres-migrations:
    runs-on: ci-linux
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        SUDO=""; command -v sudo >/dev/null && SUDO=sudo
        $SUDO apt-get update
        $SUDO apt-get install -y postgresql-client curl

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
      run: |
        set -euo pipefail
        for db in chaptarr-main chaptarr-log chaptarr-cache; do
          psql -h postgres -U chaptarr -d postgres -c "CREATE DATABASE \"$db\";"
        done

    - name: Build
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Smoke - migrate up on fresh PostgreSQL
      shell: bash
      env:
        Chaptarr__Postgres__Host: postgres
        Chaptarr__Postgres__Port: 5432
        Chaptarr__Postgres__User: chaptarr
        Chaptarr__Postgres__Password: chaptarr
        Chaptarr__Postgres__MainDb: chaptarr-main
        Chaptarr__Postgres__LogDb: chaptarr-log
        Chaptarr__Postgres__CacheDb: chaptarr-cache
        Chaptarr__Server__BindAddress: 127.0.0.1
        Chaptarr__Server__Port: 8789
      run: |
        set -euo pipefail
        DATA_DIR="$(mktemp -d)"

        dotnet run --project src/NzbDrone.Console/Chaptarr.Console.csproj -c Release --no-build --framework net10.0 -- \
          /nobrowser "/data=$DATA_DIR" > app.log 2>&1 &
        pid=$!

        ready=""
        for i in $(seq 1 90); do
          if curl -fsS "http://127.0.0.1:8789/ping" >/dev/null 2>&1; then
            ready="yes"
            break
          fi
          sleep 1
        done

        kill "$pid" >/dev/null 2>&1 || true
        wait "$pid" >/dev/null 2>&1 || true

        if [ "$ready" != "yes" ]; then
          echo "Chaptarr failed to start or /ping did not become ready."
          tail -n 400 app.log || true
          exit 1
        fi

  image:
    # Publishes only for version tags or a manual run, after every check passed.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ guards, backend, frontend, postgres-migrations ]
    runs-on: docker
    env:
      REGISTRY: git.banditserver.com
      IMAGE: git.banditserver.com/${{ github.repository_owner }}/chaptarr
    steps:
    - uses: actions/checkout@v4

    - name: Log in to the Forgejo registry
      shell: bash
      run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin

    - name: Build and push (linux/amd64)
      shell: bash
      run: |
        set -euo pipefail
        sha="$(git rev-parse --short HEAD)"
        tags=(-t "$IMAGE:sha-$sha")
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          tags+=(-t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest")
        else
          tags+=(-t "$IMAGE:develop")
        fi
        docker buildx build --platform linux/amd64 -f Dockerfile.cross \
          --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
          "${tags[@]}" --push .
