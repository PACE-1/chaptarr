name: Docker Build and Publish

# Publishes to GitHub Container Registry (ghcr.io/<owner>/chaptarr).
# - Every push to develop publishes :develop and :sha-<short>, once build.yml passed on it.
# - release.yml calls this for version tags (:<version>, plus :latest on main).
# - A manual run on any other branch publishes :branch-<name> for testing.
on:
  workflow_run:
    workflows: [ "Build Chaptarr" ]
    types: [ completed ]
    branches: [ develop ]
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: docker-${{ inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  build-and-push:
    # Develop images only follow a green push build; release and manual runs always proceed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Docker tags
      id: docker-tags
      shell: bash
      env:
        BRANCH: ${{ inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}
        RELEASE: ${{ inputs.sha && 'true' || 'false' }}
      run: |
        set -euo pipefail

        image="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/chaptarr"
        sha="$(git rev-parse HEAD)"
        tags=("$image:sha-${sha:0:7}")

        if [[ "$RELEASE" == "true" ]]; then
          version="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
          if [[ "$(git tag --points-at "$sha" --list "v${version}")" != "v${version}" ]]; then
            echo "Release tag v${version} does not point to $sha; refusing to publish."
            exit 1
          fi
          tags+=("$image:${version}")
          if [[ "$BRANCH" == "main" ]]; then
            tags+=("$image:latest")
          fi
        elif [[ "$BRANCH" == "develop" ]]; then
          tags+=("$image:develop")
        else
          # Manual runs on any other branch get a test tag and never touch :develop or :latest
          slug="$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100)"
          tags+=("$image:branch-${slug%-}")
        fi

        {
          echo 'tags<<EOF'
          printf '%s\n' "${tags[@]}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: .
        file: ./Dockerfile.cross
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.docker-tags.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
