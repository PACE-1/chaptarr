name: Shelfmark end-to-end

# Runs a real Shelfmark (with e2e/shelfmark/fake_usenet.py standing in for its Usenet
# indexer and SABnzbd) against Chaptarr, and checks a book goes all the way from search
# through grab and Shelfmark download to import into the library.
#
# Chaptarr is the published :develop image with this commit's Chaptarr.*.dll laid over
# it, which takes a few minutes instead of a full image build. A change that adds or
# bumps a NuGet package is only covered once it reaches :develop.
#
# Not a required check: it depends on the live metadata server and Shelfmark's image.
on:
  pull_request:
    branches: [ develop ]
    paths:
    - 'src/NzbDrone.Core/Indexers/Shelfmark/**'
    - 'src/NzbDrone.Core/Download/Clients/Shelfmark/**'
    - 'src/NzbDrone.Core/Download/**'
    - 'src/NzbDrone.Core/DecisionEngine/**'
    - 'src/NzbDrone.Core/IndexerSearch/**'
    - 'src/NzbDrone.Core/MediaFiles/BookImport/**'
    - 'src/NzbDrone.Core/Profiles/Delay/**'
    - 'e2e/shelfmark/**'
    - '.github/workflows/e2e-shelfmark.yml'
  schedule:
  # Nightly against :develop as published, to catch metadata or Shelfmark drift.
  - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-shelfmark-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET
      if: github.event_name != 'schedule'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      if: github.event_name != 'schedule'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-

    - name: Build this commit over the :develop image
      if: github.event_name != 'schedule'
      run: |
        dotnet build src/NzbDrone.Console/Chaptarr.Console.csproj --configuration Release --framework net10.0
        mkdir -p "$RUNNER_TEMP/overlay/app"
        cp _output/net10.0/Chaptarr*.dll _output/net10.0/Chaptarr*.pdb "$RUNNER_TEMP/overlay/app/"
        printf 'FROM ghcr.io/pace-1/chaptarr:develop\nCOPY app/ /app/\n' > "$RUNNER_TEMP/overlay/Dockerfile"
        docker build --pull -t chaptarr:e2e "$RUNNER_TEMP/overlay"
        echo "CHAPTARR_IMAGE=chaptarr:e2e" >> "$GITHUB_ENV"

    - name: Run the end-to-end check
      env:
        E2E_TIMEOUT: '420'
      run: e2e/shelfmark/ci.sh
